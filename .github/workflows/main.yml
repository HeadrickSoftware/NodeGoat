name: Security Scan
on: [pull_request]
jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Armis CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/ArmisSecurity/armis-cli/main/scripts/install.sh | bash

      - name: Scan Repository
        env:
          ARMIS_CLIENT_ID: ${{ secrets.ARMIS_CLIENT_ID }}
          ARMIS_CLIENT_SECRET: ${{ secrets.ARMIS_CLIENT_SECRET }}
        run: |
          # 1. Initialize our exit code variable
          EXIT_CODE=0

          # 2. Run the scan. The '|| EXIT_CODE=$?' syntax catches a non-zero exit 
          # without triggering the default 'set -e' behavior that kills the job.
          armis-cli scan repo . \
            --format sarif \
            --fail-on 'CRITICAL' \
            > results.sarif || EXIT_CODE=$?

          # 3. Save the exit code to the GitHub Actions environment variables
          echo "SCAN_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

      - name: Upload SARIF results
        # This step will run normally because the previous step exited with code 0
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: armis-cli

      - name: Enforce Scan Result
        # Finally, check the stored exit code. If it's not 0, fail the workflow.
        if: env.SCAN_EXIT_CODE != '0'
        run: |
          echo "::error::Armis scan found CRITICAL vulnerabilities. Failing the build."
          exit $SCAN_EXIT_CODE
